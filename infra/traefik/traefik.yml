# Traefik STATIC configuration for a MyMA VPS node.
# Per-instance routing is NOT declared here. Instead, the Docker provider reads
# labels attached to each Moodle container (Decision D1), so adding a new
# instance requires zero edits to Traefik config.
#
# This file is mounted into the Traefik container by infra/docker/docker-compose.yml
# as /etc/traefik/traefik.yml.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  # Dashboard available at http://localhost:8080/dashboard/ inside the container.
  # Do not expose it to the public internet without additional auth.
  dashboard: true
  insecure: false

ping:
  # Used by the Docker healthcheck in docker-compose.yml.
  entryPoint: traefik

log:
  level: INFO

entryPoints:
  # HTTP endpoint performs an unconditional redirect to HTTPS.
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS endpoint used by all public Moodle instances and the agent.
  websecure:
    address: ":443"

  # Internal metrics/ping endpoint (port 8080, not published to the host).
  traefik:
    address: ":8080"

providers:
  # Docker labels drive routing (Decision D1).
  docker:
    exposedByDefault: false
    network: myma-infra
    watch: true

  # File provider for shared middlewares defined in dynamic.yml.
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Let's Encrypt certificate resolver. Email is a plain contact address (not a
# secret); hardcoded because Traefik v3 does not interpolate ${VAR} here.
certificatesResolvers:
  le:
    acme:
      email: "andrian.sandi@gmail.com"
      storage: /letsencrypt/acme.json
      tlsChallenge: {}

accessLog: {}
