; MyMA Moodle PHP runtime overrides (FrankenPHP classic mode)
; These values are tuned for small-to-mid Moodle instances on a shared VPS node.

; Memory
memory_limit = 512M

; Execution / file uploads
max_execution_time = 600
max_input_time = 600
post_max_size = 500M
upload_max_filesize = 500M
max_file_uploads = 50

; OPcache — moderate cache sized for ~50 instances sharing system memory
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1

; Realpath cache for Moodle's many included files
realpath_cache_size = 64M
realpath_cache_ttl = 3600

; Error / security
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
expose_php = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; Timezone (UTC; per-instance timezone lives in Moodle config.php)
date.timezone = UTC
